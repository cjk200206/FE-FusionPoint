# data augmentation settings
augmentation:
  modality_drop:
    enable: true
    frame_drop_p: 0.4
    event_drop_p: 0.4
  frame:
    enable: true
    enable_in_train: false
    in_train_dropout_p: 0.0
    params:
      gamma_p: 0.0
      gamma_limit:
      - 15
      - 65
      brightness_p: 0.0
      brightness_limit:
      - -0.4
      - 0.6
      contrast_limit:
      - -0.2
      - 0.2
      noise_p: 0.0
      motion_blur_p: 0.0
      motion_blur_limit:
      - 10
      - 20
      dropout_p: 0.0
      dropout_size_limit:
      - 1
      - 1
      dropout_num_limit:
      - 1
      - 1
      hdr_p: 0.4
  event:
    enable: false
    enable_in_train: false
    in_train_dropout_p: 0.5
    params:
      gamma_p: 0.0
      gamma_limit:
      - 15
      - 65
      brightness_p: 0.0
      brightness_limit:
      - -0.4
      - 0.6
      contrast_limit:
      - -0.2
      - 0.2
      noise_p: 0.0
      motion_blur_p: 0.0
      motion_blur_limit:
      - 3
      - 15
      dropout_p: 0.0
      dropout_size_limit:
      - 0.2
      - 0.3
      dropout_num_limit:
      - 1
      - 1
  low_image:
    enable: false
    p: 0.5
  blur_image:
    enable: true
    p: 0.6
  use_real_blur: true

# model settings
train_type: fusion
backbone: sp-vgg-deblur
use_spbn: true
use_spbn_decoder: true
use_event_injection: true
injection_type: selective_e2f_new
use_event_enable_selector: true
input_representation: mcts
event_input_channels: 10
frame_input_channels: 1
feature_channels: 128
backbone_output_channels: 128
grid_size: 8
descriptor_size: 256
vgg_norm: gn
pixel_wise_predictions: false

# training settings
frozen_frame_backbone: false
frozen_event_backbone: false
frozen_frame_backbone_normalization: true
frozen_event_backbone_normalization: false
frozen_decoder: false
frozen_decoder_norm: true
frame_ckpt_pretrained: pretrained/superpoint_v6_from_tf.pth
event_ckpt_pretrained: pretrained/stage1.pth
pretrained_fe_detector: false
fusion_decoder: false

# loss settings
event_count_mask: false
event_points_mask: false
masked_descriptor_loss: false
feature_loss: true
logits_loss: false
logits_loss_mode: kl_div
descriptor_feature_loss_mode: cosine_similarity
desc_type: raw
double_softmax_loss: true
positive_margin: 1
negative_margin: 0.2
lambda_d: 0.5
lambda_det_loss: 1
lambda_loss: 10
detector_loss_alpha: 0.75
detector_loss_gamma: 2.0
double_softmax_loss_temperature: 0.1
cossim_loss_alpha: 0.85
cossim_loss_beta: -0.5
lambda_cossim: 0.01
lambda_l1_sparsity: 1.0
lambda_logits_loss: 0.1
coordinate_loss_concentration_weight: 0.1
lambda_descriptor_feature_loss: 1.0

# training hyperparameters
learning_rate: 0.0001
batch_size: 1
epochs: 10
max_grad_norm: 1.0
gradient_accumulation_steps: 4
num_batches_train_logging: 100
num_train_samples_before_validation: 5000
max_num_validation_samples: 5000
ts_dropout: 0.0
temporal_matching:
  enable: true
homography_adaptation:
  enable: false
  difficulty: 0.5
  max_angle: 45
  resize_factor: -1

# evaluation settings
detection_threshold: 0.05
nms_box_size: 5

# fusion settings
fusion_config:
  name: GatedChannelCBAMFusion
  is_FPN: false
  fusion_type: gated_channel_cbam
  embed_dim: 32
  dim_multiplier:
  - 2
  - 4
  - 4
  num_blocks:
  - 1
  - 1
  - 1
  attention:
    use_torch_mha: false
    partition_size: 5
    dim_head: 8
    attention_bias: true
    mlp_activation: gelu
    mlp_gated: false
    mlp_bias: true
    mlp_ratio: 4
    drop_mlp: 0.0
    drop_path: 0.0
    ls_init_value: 5.0e-05
    norm_eps: 5.0e-05
  fusion_norm: layernorm
  cbam_reduction: 16
  cbam_kernel_size: 7
  fusion_zero_init: true
descriptor_feature_loss: false
coordinate_loss: false
desc_l1_sparsity_loss: false
feature_loss_for_event: false
use_frame_only_for_descriptors: false
use_seprate_decoder: false
cosine_eta_min: 5.0e-06
