# data augmentation settings
augmentation:
  modality_drop:
    enable: false
    frame_drop_p: 0.2
    event_drop_p: 0.2
  frame:
    enable: false
    params:
      gamma_p: 0.15
      gamma_limit:
      - 15
      - 65
      brightness_p: 0.15
      brightness_limit:
      - -0.4
      - 0.6
      contrast_limit:
      - -0.2
      - 0.2
      noise_p: 0.0
      motion_blur_p: 0.1
      motion_blur_limit:
      - 3
      - 15
      dropout_p: 0.2
      dropout_size_limit:
      - 0.1
      - 0.2
      dropout_num_limit:
      - 1
      - 8
  event:
    enable: false
    params:
      gamma_p: 0.0
      gamma_limit:
      - 15
      - 65
      brightness_p: 0.0
      brightness_limit:
      - -0.4
      - 0.6
      contrast_limit:
      - -0.2
      - 0.2
      noise_p: 0.0
      motion_blur_p: 0.0
      motion_blur_limit:
      - 3
      - 15
      dropout_p: 0.5
      dropout_size_limit:
      - 0.1
      - 0.2
      dropout_num_limit:
      - 1
      - 2

# model settings
train_type: event
backbone: vgg
use_spbn: true
use_spbn_decoder: true
use_event_enable_selector: true
input_representation: mcts
input_channels: 10
event_input_channels: 10
frame_input_channels: 1
feature_channels: 128
backbone_output_channels: 128
grid_size: 8
descriptor_size: 256
vgg_norm: gn
pixel_wise_predictions: false

# training settings
frozen_backbone: false
frozen_decoder: true
frozen_decoder_norm: true
frame_ckpt_pretrained: pretrained/superpoint_v6_from_tf.pth

# loss settings
positive_margin: 1
negative_margin: 0.2
lambda_d: 0.5
lambda_loss: 10
detector_loss_alpha: 0.75
detector_loss_gamma: 2.0
double_softmax_loss_temperature: 0.1
desc_l1_loss: false
feature_loss: true
hard_E_detector_loss: false
hard_F_detector_loss: false
keypoint_mse_loss: false
event_desc_loss: false
descriptor_feature_loss: true
descriptor_feature_loss_mode: cosine_similarity
desc_type: raw
feature_loss_type: sp
cossim_loss_alpha: 0.85
cossim_loss_beta: 0.2
lambda_cossim: 0.01
lambda_l1: 1.0
lambda_hard_cossim: 0.0
lambda_hard_l1: 0.0
lambda_hard_det_loss: 0.0
lambda_e_loss: 0.0
lambda_logits_loss: 0.1
coordinate_loss_concentration_weight: 0.1

# training hyperparameters
learning_rate: 0.0001
batch_size: 1
epochs: 10
max_grad_norm: 1.0
gradient_accumulation_steps: 4
num_batches_train_logging: 100
num_train_samples_before_validation: 5000
max_num_validation_samples: 5000
ts_dropout: 0.0
temporal_matching:
  enable: true
homography_adaptation:
  enable: false
  difficulty: 0.5
  max_angle: 45
  resize_factor: -1

# evaluation settings
detection_threshold: 0.01
nms_box_size: 5
