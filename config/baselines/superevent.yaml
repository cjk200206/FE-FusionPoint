# Official event-only SuperEvent baseline; retain its MaxViT dependency.
train_type: event
input_representation: mcts
event_input_channels: 10
frame_input_channels: 1
grid_size: 8
detection_threshold: 0.01
nms_box_size: 5
backbone: maxvit
input_channels: 10
feature_channels: 128
backbone_output_channels: 128
descriptor_size: 256
pixel_wise_predictions: false
backbone_config:
  name: MaxViTRNN
  compile:
    enable: false
    args:
      mode: reduce-overhead
  enable_masking: false
  embed_dim: 32
  dim_multiplier:
  - 1
  - 2
  - 4
  num_blocks:
  - 1
  - 1
  - 1
  T_max_chrono_init:
  - 4
  - 8
  - 16
  stem:
    patch_size: 2
  stage:
    downsample:
      type: patch
      overlap: true
      norm_affine: true
    attention:
      use_torch_mha: false
      partition_size: 5
      dim_head: 8
      attention_bias: true
      mlp_activation: gelu
      mlp_gated: false
      mlp_bias: true
      mlp_ratio: 4
      drop_mlp: 0.0
      drop_path: 0.0
      ls_init_value: 5.0e-05
      norm_eps: 5.0e-05
  fpn:
    name: PAFPN
    compile:
      enable: false
      args:
        mode: reduce-overhead
    depth: 0.67
    in_stages:
    - 1
    - 2
    - 3
    depthwise: false
    act: silu
  input_channels: 10
